name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci here hits a known npm bug with platform-specific optional deps
      # (npm/cli#4828) — our lockfile was generated on macOS, and Vite's rolldown
      # binding for linux-x64 doesn't always get installed under `ci`'s strict mode.
      # `npm install` re-resolves the correct native binary for this runner.
      - run: npm install
      - run: npm run build --workspace client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
