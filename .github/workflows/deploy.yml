name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The committed lockfiles were generated on macOS and don't carry correct
      # optional-dependency data for Linux (npm/cli#4828 — rolldown's native binding
      # ends up missing). Switching npm ci -> npm install alone didn't fix it, since
      # the bad data lives in the lockfile itself. Drop the lockfiles here so npm
      # resolves everything fresh, directly on this runner's actual platform.
      - run: rm -f package-lock.json client/package-lock.json server/package-lock.json
      - run: npm install
      - run: npm run build --workspace client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
